    background: #f5f5f5;

    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
  }
  #tooltip {
    position: absolute;
    background: white;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    pointer-events: none;
    font-size: 14px;
    display: none;
  }
  svg {
    display: block;
    margin: auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
  }
  #detailsBox {
    max-width: 600px;
    margin: 25px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
  }
  #guestBox {
    max-width: 600px;
    margin: 25px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    margin-top: 12px;
    padding: 10px 15px;
    background: #4c6fff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="tooltip"></div>

<div id="detailsBox">
  <h2>Click a state to view brand sales</h2>
  <p>Select a state on the map to see prom/formalwear brand performance.</p>
</div>

<div id="guestBox">
  <h2>Ask About a Brand Not Listed</h2>
  <p>Have a brand you want included? Submit it below.</p>
  <input id="guestBrand" placeholder="Brand name (e.g., Rachel Allan)">
  <textarea id="guestMessage" rows="4" placeholder="Your question or request"></textarea>
  <button onclick="submitGuestRequest()">Submit Request</button>
  <p id="guestResponse" style="margin-top:10px; font-weight:bold;"></p>
</div>

// -----------------------------------------------------
// 2. GUEST BRAND REQUEST SECTION
// -----------------------------------------------------
function submitGuestRequest() {
  const brand = document.getElementById("guestBrand").value.trim();
  const message = document.getElementById("guestMessage").value.trim();
  const response = document.getElementById("guestResponse");

  if (!brand || !message) {
    response.textContent = "Please fill out both fields.";
    response.style.color = "red";
    return;
  }

  response.textContent = `Thanks! Your request about "${brand}" has been received.`;
  response.style.color = "green";

  document.getElementById("guestBrand").value = "";
  document.getElementById("guestMessage").value = "";
}

// -----------------------------------------------------
// 3. MAP COLOR SCALE BASED ON AVERAGE SALES
// -----------------------------------------------------
function averageSales(stateData) {
  const values = Object.values(stateData);
  return values.reduce((a, b) => a + b, 0) / values.length;
}

const colorScale = d3.scaleLinear()
  .domain([50000, 1500000]) // min → max average sales
  .range(["#cfe2f3", "#08306b"]); // light → dark blue

// -----------------------------------------------------
// 4. SVG MAP SETUP
// -----------------------------------------------------
const width = 1000;
const height = 600;

const svg = d3.select("body")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

const tooltip = d3.select("#tooltip");

// -----------------------------------------------------
// 5. LOAD U.S. MAP
// -----------------------------------------------------
d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {

  const states = topojson.feature(us, us.objects.states).features;

  const projection = d3.geoAlbersUsa()
    .translate([width/2, height/2])
    .scale(1200);

  const path = d3.geoPath().projection(projection);

  svg.selectAll("path")
    .data(states)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", d => {
      const stateName = d.properties.name;
      return brandData[stateName]
        ? colorScale(averageSales(brandData[stateName]))
        : "#ccc";
    })
    .attr("stroke", "#fff")
    .attr("stroke-width", 1)
    .on("mouseover", function(event, d) {
      tooltip.style("display", "block")
        .html(`<strong>${d.properties.name}</strong>`);
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.pageX + 15) + "px")
             .style("top", (event.pageY - 20) + "px");
    })
    .on("mouseout", function() {
      tooltip.style("display", "none");
    })
    .on("click", function(event, d) {
      const state = d.properties.name;
      const detailsBox = document.getElementById("detailsBox");

      if (brandData[state]) {
        let html = `<h2>${state} — Brand Sales</h2><ul>`;
        for (const brand in brandData[state]) {
          html += `<li><strong>${brand}:</strong> $${brandData[state][brand].toLocaleString()}</li>`;
        }
        html += "</ul>";
        detailsBox.innerHTML = html;
      } else {
        detailsBox.innerHTML = `<h2>${state}</h2><p>No data available for this state.</p>`;
      }
    });

});
</script>

</body>
</html>
